name: Protect

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: protect-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  protect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - name: Fetch the pull request as data, never as code to run
        run: git fetch --quiet origin "refs/pull/$PR/head"
        env:
          PR: ${{ github.event.pull_request.number }}
      - name: Name every check this pull request weakens
        run: node scripts/check-weakened.mjs "$(git merge-base origin/main FETCH_HEAD)" FETCH_HEAD
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
      - name: Say how the change was verified
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        run: node scripts/check-verified.mjs
        env:
          MODE: observe
          PR_BODY: ${{ github.event.pull_request.body }}
