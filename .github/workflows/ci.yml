name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: bash

# A newer push to a pull request supersedes its run. On main every run finishes, so a deploy is
# never cut off between its migration and its upload.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  title:
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: node scripts/check-pr-title.mjs "$TITLE"
        env:
          TITLE: ${{ github.event.pull_request.title }}

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - name: Dry-run both deployments
        run: pnpm deploy:check

  guards:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/holler
          key: tla2tools-${{ hashFiles('scripts/check-models.mjs') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm guards:prove --shard ${{ matrix.part }}/4

  # TLC over the models in formal/. ADR 0005.
  models:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/holler
          key: tla2tools-${{ hashFiles('scripts/check-models.mjs') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:models

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm test:e2e
      - run: pnpm guards:prove --browser
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: playwright-report

  # Each pull request gets a version of the holler-preview Worker at its own alias, with the dev
  # personas on and its own database. docs/operations.md.
  preview:
    needs: verify
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: preview
      url: ${{ steps.url.outputs.url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PR: ${{ github.event.pull_request.number }}
      SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check Cloudflare credentials
        id: credentials
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::warning::No CLOUDFLARE_API_TOKEN secret, so this pull request has no preview. docs/operations.md."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.credentials.outputs.skip != 'true'
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: steps.credentials.outputs.skip != 'true'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.credentials.outputs.skip != 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.credentials.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile
      - name: Build for the preview Worker
        if: steps.credentials.outputs.skip != 'true'
        run: pnpm --filter @holler/web exec vite build
        env:
          CLOUDFLARE_ENV: preview
      - name: Migrate the preview database
        if: steps.credentials.outputs.skip != 'true'
        working-directory: apps/web
        run: pnpm exec wrangler d1 migrations apply holler-preview --remote --env preview
      - name: Create the preview Worker if it does not exist yet
        if: steps.credentials.outputs.skip != 'true'
        working-directory: apps/web
        run: |
          pnpm exec wrangler deployments list -c dist/holler/wrangler.json > /dev/null 2>&1 ||
            pnpm exec wrangler deploy -c dist/holler/wrangler.json --tag "$SHA" --message "Create holler-preview"
      - name: Upload this pull request's version
        if: steps.credentials.outputs.skip != 'true'
        working-directory: apps/web
        env:
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-preview.jsonl
        run: >-
          pnpm exec wrangler versions upload -c dist/holler/wrangler.json
          --preview-alias "pr-$PR" --tag "$SHA" --message "PR #$PR at $SHA"
      # A preview alias reports an empty tag at runtime, so match the uploaded version id instead.
      - name: Wait for the preview to serve this version
        id: url
        if: steps.credentials.outputs.skip != 'true'
        run: |
          url="https://pr-$PR-holler-preview.k-porshnieva.workers.dev"
          version=$(node scripts/wrangler-version.mjs "$RUNNER_TEMP/wrangler-preview.jsonl")
          node scripts/check-deployment.mjs "$url" holler "$version"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview: $url, version $version. Dev routes need the DEV_ROUTES_KEY header; verify with --version $version." >> "$GITHUB_STEP_SUMMARY"

  ready:
    needs: [title, verify, guards, models, e2e, preview]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every job, and allow only the pull request jobs to be skipped
        run: >-
          jq -e 'to_entries | map(select(.value.result != "success" and
          ((.value.result == "skipped" and (.key == "title" or .key == "preview")) | not)))
          | if length > 0 then (map("\(.key): \(.value.result)") | join(", ") | halt_error(1)) else true end'
          <<< "$NEEDS"
        env:
          NEEDS: ${{ toJSON(needs) }}

  # Production and the preview Worker's base version follow main. Merging is the deploy.
  deploy:
    needs: [ready]
    if: ${{ !cancelled() && needs.ready.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: deploy
      cancel-in-progress: false
    environment:
      name: production
      url: https://holler.k-porshnieva.workers.dev
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check Cloudflare credentials
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN secret to deploy. docs/operations.md."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Build the product
        run: pnpm --filter @holler/web exec vite build
      - name: Migrate the production database
        working-directory: apps/web
        run: pnpm exec wrangler d1 migrations apply holler --remote
      - name: Deploy the product
        working-directory: apps/web
        env:
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-product.jsonl
        run: pnpm exec wrangler deploy -c dist/holler/wrangler.json --tag "$GITHUB_SHA" --message "main at $GITHUB_SHA"
      - name: Build and deploy the site
        working-directory: apps/site
        env:
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-site.jsonl
        run: |
          pnpm build
          pnpm exec wrangler deploy --tag "$GITHUB_SHA" --message "main at $GITHUB_SHA"
      - name: Check production serves the new versions
        run: |
          node scripts/check-deployment.mjs https://holler.k-porshnieva.workers.dev holler \
            "$(node scripts/wrangler-version.mjs "$RUNNER_TEMP/wrangler-product.jsonl")"
          node scripts/check-deployment.mjs https://holler-site.k-porshnieva.workers.dev holler-site \
            "$(node scripts/wrangler-version.mjs "$RUNNER_TEMP/wrangler-site.jsonl")"

      - name: Build for the preview Worker
        run: pnpm --filter @holler/web exec vite build
        env:
          CLOUDFLARE_ENV: preview
      - name: Migrate the preview database
        working-directory: apps/web
        run: pnpm exec wrangler d1 migrations apply holler-preview --remote --env preview
      - name: Deploy the preview Worker's base version
        working-directory: apps/web
        env:
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-preview-base.jsonl
        run: |
          pnpm exec wrangler deploy -c dist/holler/wrangler.json --tag "$GITHUB_SHA" --message "main at $GITHUB_SHA"
          node ../../scripts/check-deployment.mjs https://holler-preview.k-porshnieva.workers.dev holler \
            "$(node ../../scripts/wrangler-version.mjs "$RUNNER_TEMP/wrangler-preview-base.jsonl")"
